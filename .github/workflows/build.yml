name: Build Elyon AI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ── Android APK ──────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Add Android platform
        run: flutter create --platforms=android . 2>/dev/null || true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "Icons generation skipped"

      # --split-per-abi builds arm32, arm64, x86_64 in one command
      - name: Build APKs (all ABIs)
        run: flutter build apk --release --split-per-abi

      - name: List APK outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload arm64 APK (modern devices)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload arm32 APK (Galaxy J4 and older)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  # ── Linux Bundle ─────────────────────────────────────────────────
  build-linux:
    name: Linux Bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libsecret-1-0 \
            libjsoncpp-dev libglib2.0-dev

      - name: Verify libsecret
        run: |
          pkg-config --modversion libsecret-1
          dpkg -L libsecret-1-dev | grep '\.pc$'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Add Linux platform
        run: flutter create --platforms=linux . 2>/dev/null || true

      - name: Build Linux release
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: flutter build linux --release

      - name: Package tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../elyon-ai-linux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: elyon-ai-linux.tar.gz

  # ── macOS DMG ─────────────────────────────────────────────────────
  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Add macOS platform
        run: flutter create --platforms=macos . 2>/dev/null || true

      - name: Build macOS release
        run: flutter build macos --release

      - name: Find and list .app
        run: |
          find build/macos -name "*.app" -maxdepth 8 | grep -v "\.app/" | head -5
          ls build/macos/Build/Products/Release/ 2>/dev/null || true

      - name: Package DMG
        run: |
          APP=$(find build/macos -name "*.app" -maxdepth 8 | grep -v "\.app/" | head -1)
          echo "App: $APP"
          [ -z "$APP" ] && exit 1
          hdiutil create -volname "Elyon AI" -srcfolder "$APP" -ov -format UDZO elyon-ai-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: elyon-ai-macos.dmg

  # ── Release ───────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-android, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk-arm64/app-arm64-v8a-release.apk
            artifacts/android-apk-arm32/app-armeabi-v7a-release.apk
            artifacts/linux-bundle/elyon-ai-linux.tar.gz
            artifacts/macos-dmg/elyon-ai-macos.dmg
          name: Elyon AI ${{ github.ref_name }}
          body: |
            ## Elyon AI ${{ github.ref_name }}
            | Platform | File | Devices |
            |---|---|---|
            | 🤖 Android 64-bit | `app-arm64-v8a-release.apk` | Android 5+, modern devices |
            | 🤖 Android 32-bit | `app-armeabi-v7a-release.apk` | Older devices (Galaxy J4 etc) |
            | 🐧 Linux | `elyon-ai-linux.tar.gz` | Extract and run `elyon_app` |
            | 🍎 macOS | `elyon-ai-macos.dmg` | macOS 10.14+ |
