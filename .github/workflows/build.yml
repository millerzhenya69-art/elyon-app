name: Build Elyon AI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ── Android APK ─────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Add Android platform
        run: flutter create --platforms=android . || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  # ── Linux .deb + AppImage ────────────────────────────────────────
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev \
            fuse libfuse2 appstream

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Add Linux platform
        run: flutter create --platforms=linux . || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cat > AppDir/usr/share/applications/elyon-ai.desktop << 'EOF'
          [Desktop Entry]
          Name=Elyon AI
          Exec=elyon_app
          Icon=elyon-ai
          Type=Application
          Categories=Utility;
          EOF
          cp assets/elyon_logo.png AppDir/usr/share/icons/hicolor/256x256/apps/elyon-ai.png 2>/dev/null || true
          cp AppDir/usr/share/applications/elyon-ai.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/256x256/apps/elyon-ai.png AppDir/ 2>/dev/null || true
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir elyon-ai-linux.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: elyon-ai-linux.AppImage

  # ── macOS .dmg ───────────────────────────────────────────────────
  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Add macOS platform
        run: flutter create --platforms=macos . || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/elyon_app.app"
          hdiutil create -volname "Elyon AI" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            elyon-ai-macos.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: elyon-ai-macos.dmg

  # ── Release: собираем все артефакты в один релиз ─────────────────
  release:
    name: Publish Release
    needs: [build-android, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/app-arm64-v8a-release.apk
            artifacts/linux-appimage/elyon-ai-linux.AppImage
            artifacts/macos-dmg/elyon-ai-macos.dmg
          name: Elyon AI ${{ github.ref_name }}
          body: |
            ## Elyon AI ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |---|---|
            | 🤖 Android | `app-arm64-v8a-release.apk` |
            | 🐧 Linux | `elyon-ai-linux.AppImage` |
            | 🍎 macOS | `elyon-ai-macos.dmg` |

            Windows билд доступен отдельно.
