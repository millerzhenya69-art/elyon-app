name: Build Elyon AI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ── Android APK ──────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Add Android platform
        run: flutter create --platforms=android --org com.unkony . 2>/dev/null || true

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 .github/scripts/patch_gradle_signing.py

      - name: Add deep link intent-filter (elyonai://)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|</activity>|<intent-filter>\n            <action android:name="android.intent.action.VIEW"/>\n            <category android:name="android.intent.category.DEFAULT"/>\n            <category android:name="android.intent.category.BROWSABLE"/>\n            <data android:scheme="elyonai"/>\n        </intent-filter>\n    </activity>|' "$MANIFEST"
          grep -A5 'scheme="elyonai"' "$MANIFEST"

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "Icons generation skipped"

      # --split-per-abi builds arm32, arm64, x86_64 in one command
      - name: Build APKs (all ABIs)
        run: flutter build apk --release --split-per-abi

      - name: List APK outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload arm64 APK (modern devices)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload arm32 APK (Galaxy J4 and older)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  # ── Linux Bundle ─────────────────────────────────────────────────
  build-linux:
    name: Linux Bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libsecret-1-0 \
            libjsoncpp-dev libglib2.0-dev \
            libkeybinder-3.0-dev \
            libayatana-appindicator3-dev libnotify-dev \
            libwebkit2gtk-4.1-dev

      - name: Verify libsecret
        run: |
          pkg-config --modversion libsecret-1
          dpkg -L libsecret-1-dev | grep '\.pc$'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Add Linux platform
        run: flutter create --platforms=linux . 2>/dev/null || true

      - name: Build Linux release
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: flutter build linux --release

      - name: Package tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../elyon-ai-linux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: elyon-ai-linux.tar.gz

  # ── Windows Build ────────────────────────────────────────────
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Add Windows platform
        run: flutter create --platforms=windows .
        continue-on-error: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: List build output
        run: Get-ChildItem build\windows\x64\runner\Release\

      - name: Package zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath elyon-ai-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: elyon-ai-windows.zip

  # ── macOS DMG ─────────────────────────────────────────────────────
  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Add macOS platform
        run: flutter create --platforms=macos . 2>/dev/null || true

      - name: Bump macOS deployment target (flutter_web_auth_2 needs 10.15+)
        run: |
          sed -i '' "s/platform :osx, '10\.[0-9]*'/platform :osx, '10.15'/" macos/Podfile
          grep "platform :osx" macos/Podfile
          if [ -f macos/Runner/Configs/AppInfo.xcconfig ]; then
            sed -i '' "s/MACOSX_DEPLOYMENT_TARGET = 10\.[0-9]*/MACOSX_DEPLOYMENT_TARGET = 10.15/" macos/Runner/Configs/AppInfo.xcconfig
          fi

      - name: Build macOS release
        run: flutter build macos --release

      - name: Find and list .app
        run: |
          find build/macos -name "*.app" -maxdepth 8 | grep -v "\.app/" | head -5
          ls build/macos/Build/Products/Release/ 2>/dev/null || true

      - name: Package DMG
        run: |
          APP=$(find build/macos -name "*.app" -maxdepth 8 | grep -v "\.app/" | head -1)
          echo "App: $APP"
          [ -z "$APP" ] && exit 1
          hdiutil create -volname "Elyon AI" -srcfolder "$APP" -ov -format UDZO elyon-ai-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: elyon-ai-macos.dmg

  # ── Release ───────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-android, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk-arm64/app-arm64-v8a-release.apk
            artifacts/android-apk-arm32/app-armeabi-v7a-release.apk
            artifacts/linux-bundle/elyon-ai-linux.tar.gz
            artifacts/macos-dmg/elyon-ai-macos.dmg
            artifacts/windows-build/elyon-ai-windows.zip
          name: Elyon AI ${{ github.ref_name }}
          body: |
            ## Elyon AI ${{ github.ref_name }}
            | Platform | File | Devices |
            |---|---|---|
            | 🤖 Android 64-bit | `app-arm64-v8a-release.apk` | Android 5+, modern devices |
            | 🤖 Android 32-bit | `app-armeabi-v7a-release.apk` | Older devices (Galaxy J4 etc) |
            | 🐧 Linux | `elyon-ai-linux.tar.gz` | Extract and run `elyon_app` |
            | 🍎 macOS | `elyon-ai-macos.dmg` | macOS 10.14+ |
