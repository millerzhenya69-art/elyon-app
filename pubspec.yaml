name: elyon_ai
description: Elyon AI - Cross-platform AI assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.0
  http: ^1.2.1

  # PKCE code_verifier/code_challenge hashing for Google OAuth (Authorization Code flow)
  crypto: ^3.0.3

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Markdown rendering for AI responses
  flutter_markdown: ^0.6.22

  # Animations
  flutter_animate: ^4.5.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  file_picker: ^8.0.0
  app_links: ^6.3.2
  flutter_web_auth_2: ^4.1.0

  # Desktop-only (guarded by Platform.isWindows checks in code)
  window_manager: ^0.3.9
  tray_manager: ^0.2.3
  hotkey_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/elyon_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0e0e0e"
  adaptive_icon_foreground: "assets/images/elyon_logo.png"

flutter:
  uses-material-design: true

  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic

    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500

  assets:
    - assets/images/
    - assets/fonts/
